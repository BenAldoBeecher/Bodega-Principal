{% extends 'admin/base_admin.html' %}
{% block title %}{{ titulo }} - Music Pro Bodega{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">{{ titulo }}</h4>
    {% if cancelar_pk %}
    <a href="{% url cancelar_url_name cancelar_pk %}" class="btn btn-sm btn-outline-secondary">Volver</a>
    {% else %}
    <a href="{% url cancelar_url_name %}" class="btn btn-sm btn-outline-secondary">Volver</a>
    {% endif %}
</div>
<div class="card p-4 col-lg-8">
    <form method="post" novalidate>
        {% include 'admin/_formulario_entidad.html' %}
    </form>
</div>
{% endblock %}
