{% extends 'admin/base_admin.html' %}
{% block title %}{{ titulo }} - Music Pro Bodega{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">{{ titulo }}</h4>
    <a href="{% url cancelar_url_name %}" class="btn btn-sm btn-outline-secondary">Volver</a>
</div>
<div class="card p-4 col-lg-7">
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label small fw-semibold" for="id_codigo">Código</label>
            <input type="text" name="codigo" id="id_codigo" class="form-control"
                   value="{{ datos.codigo }}" placeholder="SUC-01" required>
            {% if errores.codigo %}<div class="text-danger small">{{ errores.codigo }}</div>{% endif %}
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold" for="id_nombre">Nombre</label>
            <input type="text" name="nombre" id="id_nombre" class="form-control"
                   value="{{ datos.nombre }}" placeholder="Sucursal Centro" required>
            {% if errores.nombre %}<div class="text-danger small">{{ errores.nombre }}</div>{% endif %}
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold" for="id_direccion">Dirección</label>
            <input type="text" name="direccion" id="id_direccion" class="form-control"
                   value="{{ datos.direccion }}" placeholder="Av. Principal 123">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" name="activa" id="id_activa" class="form-check-input"
                   {% if datos.activa %}checked{% endif %}>
            <label class="form-check-label small fw-semibold" for="id_activa">Sucursal activa</label>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-blue">Guardar</button>
            <a href="{% url cancelar_url_name %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
