{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Music Pro - Bodega{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --blue: #1e4d8c;
            --blue-light: #2b6cb0;
            --blue-soft: #e8f0fe;
        }
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
        .bg-blue { background-color: var(--blue) !important; }
        .btn-blue { background-color: var(--blue); color: #fff; border: none; }
        .btn-blue:hover { background-color: var(--blue-light); color: #fff; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-radius: 10px; }
        .stat-card { border-left: 4px solid var(--blue); }
        .sidebar { min-height: calc(100vh - 56px); background: #fff; border-right: 1px solid #e2e8f0; }
        .sidebar .nav-link { color: #475569; border-radius: 8px; margin: 2px 8px; padding: 10px 14px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
        .table th { font-weight: 600; font-size: 0.85rem; color: #64748b; border-bottom-width: 1px; }
        .badge-alerta { background: #fef2f2; color: #b91c1c; }
        .badge-ok { background: #f0fdf4; color: #15803d; }
        footer { font-size: 0.85rem; color: #94a3b8; }
        @media (max-width: 768px) {
            .sidebar { min-height: auto; border-right: none; border-bottom: 1px solid #e2e8f0; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
